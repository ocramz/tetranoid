<!DOCTYPE html>
<!-- Source of src/icons/og-image.png, the 1200×630 link-preview banner.
     `npm run og` screenshots this page; edit it, re-run, commit the PNG. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:'Bungee';src:url(../src/fonts/bungee-latin-400.woff2) format('woff2')}
@font-face{font-family:'Saira Condensed';font-weight:600;src:url(../src/fonts/saira-condensed-latin-600.woff2) format('woff2')}
@font-face{font-family:'Saira Condensed';font-weight:400;src:url(../src/fonts/saira-condensed-latin-400.woff2) format('woff2')}
:root{--ink:#e9efff;--dim:#8ba0c9;--p1:#ff4fb0;--p2:#32e3ff}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{position:relative;background:radial-gradient(ellipse 75% 90% at 38% 42%,#13204a,#070a16);
     font-family:'Saira Condensed',sans-serif;color:var(--ink)}
/* faint playfield grid, fading out toward the middle */
.grid{position:absolute;inset:0;
      background-image:linear-gradient(rgba(120,150,255,.07) 1px,transparent 1px),
                       linear-gradient(90deg,rgba(120,150,255,.07) 1px,transparent 1px);
      background-size:42px 42px;background-position:-1px -1px;
      -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,transparent 30%,#000 100%)}
.cells{position:absolute;inset:0}
.cells i{position:absolute;width:38px;height:38px;border-radius:6px;opacity:.22}
.wrap{position:absolute;inset:0;display:flex;align-items:center;gap:36px;padding:0 90px 0 70px}
.logo{width:400px;height:400px;flex:none}
.text{display:flex;flex-direction:column;gap:22px}
h1{font-family:'Bungee',cursive;font-weight:400;font-size:170px;line-height:.92;margin:0;color:#fff;
   text-shadow:6px 0 0 var(--p1),-6px 0 0 var(--p2),0 0 60px rgba(90,140,255,.6)}
.tag{margin:0;font-size:44px;font-weight:600;letter-spacing:.01em;line-height:1.1}
.tag .a{color:var(--p1)} .tag .b{color:var(--p2)}
.sub{margin:0;font-size:38px;color:var(--dim);letter-spacing:.04em}
</style>
</head>
